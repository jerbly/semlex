[package]
name = "fixture-service"
description = "Example service instrumented with the demo registry's signal macros."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
fixture-semconv = { path = "../fixture-semconv", features = ["semlex-unstable"] }
semlex = { path = "../../crates/semlex" }
opentelemetry = "0.33"

[dev-dependencies]
semlex = { path = "../../crates/semlex", features = ["testing"] }
opentelemetry = { version = "0.33", features = ["trace"] }
opentelemetry_sdk = { version = "0.33", features = ["testing", "metrics", "logs", "trace"] }
opentelemetry-appender-tracing = "0.33"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true
