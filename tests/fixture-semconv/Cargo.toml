[package]
name = "fixture-semconv"
description = "Example registry crate: registry!() over the fixture registry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
semlex = { path = "../../crates/semlex" }
# For the `conversions` example: `http::Method` into `HttpRequestMethod`.
http = "1.3"

[lints]
workspace = true

[features]
# Allows non-stable registry items (attributes, enum values) at call sites.
semlex-unstable = []

[dev-dependencies]
trybuild = "1.0"
tracing = "0.1.44"

[[test]]
name = "unstable"
required-features = ["semlex-unstable"]
