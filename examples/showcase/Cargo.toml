[package]
name = "showcase"
description = "A small shop service instrumented with semlex: every feature, runnable."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
semlex = { path = "../../crates/semlex" }
opentelemetry = "0.33"
# For `conversions`: an `http::Method` is accepted for `http.request.method`.
http = "1.3"
# For the runnable demo (`cargo run -p showcase`): print telemetry to stdout.
opentelemetry_sdk = { version = "0.33", features = ["metrics", "logs", "trace"] }
opentelemetry-stdout = "0.33"
opentelemetry-appender-tracing = "0.33"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }

[dev-dependencies]
semlex = { path = "../../crates/semlex", features = ["testing"] }
trybuild = "1.0"

[features]
# Allows non-stable registry items at call sites.
semlex-unstable = []

[lints]
workspace = true
