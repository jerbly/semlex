file_format: resolved/2.0
schema_url: https://semlex.example/schemas/0.1.0
attribute_catalog:
- key: container.id
  type: string
  brief: Container ID.
  stability: development
- key: db.connection_string
  type: string
  brief: Deprecated, use `server.address` and `server.port`.
  stability: development
  deprecated:
    reason: uncategorized
    note: Replaced by `server.address` and `server.port`.
- key: db.hbase.region
  type: string
  brief: HBase region name.
  stability: development
- key: db.jdbc.driver_classname
  type: string
  brief: Removed, no replacement at this time.
  stability: development
  deprecated:
    reason: obsoleted
    note: Removed, no replacement at this time.
- key: db.namespace
  type: string
  brief: The HBase namespace.
  note: For HBase this is the namespace, not a database.
  stability: release_candidate
  annotations:
    cardinality: bounded
- key: db.namespace
  type: string
  brief: The name of the database.
  stability: release_candidate
- key: db.operation
  type: string
  brief: Deprecated, use `db.operation.name` instead.
  stability: development
  deprecated:
    reason: renamed
    renamed_to: db.operation.name
    note: Renamed.
- key: db.operation.name
  type: string
  brief: The name of the operation being executed.
  stability: release_candidate
- key: db.system.name
  type: string
  examples:
  - postgresql
  - hbase
  brief: The database management system.
  stability: release_candidate
- key: demo.cache.hit
  type:
    members:
    - id: hit
      value: true
      brief: The cache had the entry.
      stability: development
    - id: miss
      value: false
      brief: The cache did not have the entry.
      stability: development
  brief: Cache outcome.
  stability: development
- key: demo.flags
  type: boolean[]
  brief: Feature flags evaluated for the request.
  stability: development
- key: demo.internal_debug
  type: string
  brief: Internal debug data; never emitted from code.
  stability: development
  annotations:
    code_generation:
      exclude: true
- key: demo.label
  type: template[string]
  brief: Free-form labels, `<key>` being the label name.
  stability: development
- key: demo.match
  type: string
  brief: The matched rule.
  stability: development
  annotations:
    code_generation:
      rust:
        ident: matched
- key: demo.payload
  type: any
  brief: A structured payload. Only valid on log records.
  stability: development
- key: demo.retry.delays
  type: int[]
  brief: Delays between retries, in milliseconds.
  stability: development
- key: demo.tenant.code
  type: string
  brief: Short code identifying the tenant.
  stability: stable
  annotations:
    demo:
      case: upper
- key: demo.tier
  type:
    members:
    - id: free
      value: free
      brief: Free tier.
      stability: stable
    - id: pro
      value: pro
      brief: Paid tier.
      stability: beta
    - id: legacy
      value: legacy
      brief: Legacy paid tier.
      stability: stable
      deprecated:
        reason: renamed
        renamed_to: pro
        note: Use `pro`.
    - id: internal
      value: internal
      brief: Internal accounts.
      stability: development
      annotations:
        code_generation:
          exclude: true
  brief: Service tier.
  stability: beta
  annotations:
    code_generation:
      rust:
        enum_name: ServiceTier
- key: demo.timeout
  type: double
  brief: Configured request timeout, in seconds.
  stability: stable
  annotations:
    code_generation:
      rust:
        type: std::time::Duration
- key: demo.type
  type: string
  brief: The kind of demo object.
  stability: development
- key: demo.weights
  type: double[]
  brief: Load-balancer weights.
  stability: stable
- key: exception.message
  type: string
  brief: The exception message.
  stability: stable
- key: exception.stacktrace
  type: string
  brief: A stacktrace as a string.
  stability: stable
- key: exception.type
  type: string
  brief: The type of the exception.
  stability: stable
- key: host.arch
  type: string
  brief: The CPU architecture of the host.
  stability: development
- key: host.name
  type: string
  brief: Name of the host.
  stability: development
- key: host.os.build
  type: string
  brief: OS build number (Windows hosts).
  stability: development
- key: http.method
  type: string
  brief: Deprecated, use `http.request.method` instead.
  stability: stable
  deprecated:
    reason: renamed
    renamed_to: http.request.method
    note: Replaced by `http.request.method`.
- key: http.request.body.size
  type: int
  brief: Size of the request body in bytes.
  stability: development
  annotations:
    cardinality: unbounded
- key: http.request.header
  type: template[string[]]
  examples:
  - - application/json
  brief: HTTP request headers, `<key>` being the normalized header name.
  stability: stable
- key: http.request.method
  type:
    members:
    - id: connect
      value: CONNECT
      brief: CONNECT method.
      stability: stable
    - id: delete
      value: DELETE
      brief: DELETE method.
      stability: stable
    - id: get
      value: GET
      brief: GET method.
      stability: stable
    - id: post
      value: POST
      brief: POST method.
      stability: stable
    - id: put
      value: PUT
      brief: PUT method.
      stability: stable
    - id: query
      value: QUERY
      brief: QUERY method (draft).
      stability: development
    - id: other
      value: _OTHER
      brief: Any HTTP method not listed.
      stability: stable
  brief: HTTP request method.
  stability: stable
- key: http.request.resend
  type: boolean
  brief: Whether this is a resend of an earlier request.
  stability: beta
- key: http.response.status_code
  type: int
  examples:
  - 200
  - 404
  brief: HTTP response status code.
  stability: stable
- key: http.route
  type: string
  examples:
  - /users/{id}
  brief: The matched route template.
  stability: stable
- key: http.server.sample_rate
  type: double
  brief: Fraction of requests sampled by the server.
  stability: alpha
- key: process.command_args
  type: string[]
  brief: All the command arguments.
  stability: development
- key: rpc.grpc.status_code
  type:
    members:
    - id: ok
      value: 0
      brief: OK
      stability: development
    - id: cancelled
      value: 1
      brief: CANCELLED
      stability: development
    - id: unknown
      value: 2
      brief: UNKNOWN
      stability: development
  brief: Numeric gRPC status code.
  stability: development
- key: service.instance.id
  type: string
  brief: The string ID of the service instance.
  stability: development
- key: service.name
  type: string
  brief: Logical name of the service.
  stability: stable
- key: service.namespace
  type: string
  brief: A namespace for `service.name`.
  stability: development
- key: service.version
  type: string
  brief: The version string of the service.
  stability: stable
- key: session.id
  type: string
  brief: A unique id to identify a session.
  stability: development
- key: session.previous_id
  type: string
  brief: The previous session id.
  stability: development
- key: url.path
  type: string
  examples:
  - /users/42
  brief: The URI path component.
  stability: stable
  annotations:
    cardinality: unbounded
- key: url.path
  type: string
  examples:
  - /users/42
  brief: The URI path component.
  note: On this span the path is normalized before recording, so it is bounded.
  stability: stable
  annotations:
    cardinality: bounded
- key: url.scheme
  type: string
  examples:
  - https
  brief: The URI scheme component.
  stability: stable
- key: url.template
  type: string
  examples:
  - /users/{id}
  brief: The low-cardinality template of the URL.
  stability: release_candidate
- key: user.email
  type: string
  brief: User email address.
  stability: stable
  annotations:
    sensitivity: pii
- key: user.id
  type: string
  brief: Unique identifier of the user.
  stability: development
  annotations:
    cardinality: bounded
- key: user.id
  type: string
  brief: Unique identifier of the user.
  stability: development
  annotations:
    cardinality: unbounded
    sensitivity: pii
registry:
  attributes:
  - 0
