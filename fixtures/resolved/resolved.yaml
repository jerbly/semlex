  attribute_groups:
  - id: demo.legacy_db
    attributes:
    - base: 1
      requirement_level: recommended
    - base: 3
      requirement_level: recommended
    brief: Deprecated database connection attributes.
    stability: development
    deprecated:
      reason: obsoleted
      note: Use the database spans instead.
  - id: exception
    attributes:
    - base: 21
      requirement_level: required
    - base: 22
      requirement_level: recommended
    - base: 23
      requirement_level: required
    brief: Attributes describing an exception.
    stability: stable
  spans:
  - type: db.client
    kind: client
    name:
      note: '{db.operation.name} {db.namespace}, or the database-specific query summary.'
    attributes:
    - base: 5
      requirement_level: required
    - base: 6
      requirement_level: recommended
    - base: 7
      requirement_level:
        conditionally_required: If readily available.
    - base: 8
      requirement_level: required
      sampling_relevant: true
    entity_associations:
    - type: service
    requirement_level: recommended
    brief: A database client call.
    stability: release_candidate
  - type: demo.cache.lookup
    kind: internal
    name:
      templates:
      - pattern: cache lookup
        attributes: []
        parts:
        - type: literal
          value: cache lookup
    attributes:
    - base: 9
      requirement_level: required
    - base: 17
      requirement_level: recommended
    requirement_level: opt_in
    brief: A cache lookup.
    stability: development
  - type: demo.legacy.request
    kind: server
    name:
      templates:
      - pattern: legacy request
        attributes: []
        parts:
        - type: literal
          value: legacy request
    attributes:
    - base: 30
      requirement_level: recommended
    requirement_level: recommended
    brief: Legacy request span.
    stability: development
    deprecated:
      reason: renamed
      renamed_to: http.server.request
      note: Use `http.server.request`.
  - type: http.server.request
    kind: server
    name:
      templates:
      - pattern: '{http.request.method} {http.route}'
        attributes:
        - http.request.method
        - http.route
        parts:
        - type: attribute
          attribute: http.request.method
        - type: literal
          value: ' '
        - type: attribute
          attribute: http.route
      - pattern: '{http.request.method}'
        attributes:
        - http.request.method
        parts:
        - type: attribute
          attribute: http.request.method
      - pattern: HTTP
        attributes: []
        parts:
        - type: literal
          value: HTTP
    attributes:
    - base: 16
      requirement_level: required
    - base: 29
      requirement_level: opt_in
    - base: 30
      requirement_level: required
      sampling_relevant: true
    - base: 31
      requirement_level: recommended
    - base: 32
      requirement_level:
        conditionally_required: If and only if one was received or sent.
    - base: 33
      requirement_level:
        conditionally_required: If and only if it's available.
    - base: 44
      requirement_level: required
    - base: 45
      requirement_level: required
      sampling_relevant: true
    - base: 48
      requirement_level:
        recommended: When the user is authenticated.
    entity_associations:
    - all_of:
      - type: service
      - one_of:
        - type: host
        - type: container
    requirement_level: recommended
    brief: An HTTP request handled by a server.
    stability: stable
  metrics:
  - name: demo.cache.fill_ratio
    instrument: gauge
    unit: '1'
    attributes:
    - base: 17
      requirement_level: required
    requirement_level: opt_in
    brief: Fraction of the cache in use.
    stability: development
  - name: demo.internal.counter
    instrument: counter
    unit: '1'
    requirement_level: recommended
    brief: Internal counter; not emitted from code.
    stability: development
    annotations:
      code_generation:
        exclude: true
  - name: http.server.active_requests
    instrument: updowncounter
    unit: '{request}'
    attributes:
    - base: 30
      requirement_level: recommended
    - base: 45
      requirement_level: recommended
    requirement_level: recommended
    brief: Number of active HTTP server requests.
    stability: development
  - name: http.server.request.count
    instrument: counter
    unit: '{request}'
    attributes:
    - base: 30
      requirement_level: required
    requirement_level: recommended
    brief: Number of HTTP server requests.
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
  - name: http.server.request.duration
    instrument: histogram
    unit: s
    attributes:
    - base: 30
      requirement_level: required
    - base: 32
      requirement_level:
        conditionally_required: If and only if one was received or sent.
    - base: 33
      requirement_level: required
    - base: 45
      requirement_level: recommended
    entity_associations:
    - type: service
    requirement_level: recommended
    brief: Duration of HTTP server requests.
    stability: stable
    annotations:
      code_generation:
        metric_value_type: double
      demo:
        slo:
          objective: 0.99
          latency: 0.5
  events:
  - name: demo.payload.received
    attributes:
    - base: 14
      requirement_level: required
    - base: 47
      requirement_level: recommended
    requirement_level: opt_in
    brief: A structured payload was received.
    stability: development
  - name: session.start
    attributes:
    - base: 41
      requirement_level: required
    - base: 42
      requirement_level:
        conditionally_required: If a previous session existed.
    entity_associations:
    - type: service
    requirement_level: recommended
    brief: Indicates that a session has started.
    stability: development
  entities:
  - type: container
    identity:
    - 0
    requirement_level: recommended
    brief: A container.
    stability: development
  - type: host
    identity:
    - 25
    description:
