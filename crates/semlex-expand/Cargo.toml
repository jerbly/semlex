[dependencies]
semlex-schema.workspace = true
proc-macro2 = "1.0"
quote = "1.0"
serde_json = "1.0"
syn = { version = "3.0", features = ["full"] }

[dev-dependencies]
insta = "1.49"
prettyplease = "0.3"

[lints]
workspace = true
